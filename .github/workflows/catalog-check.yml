# The catalog check (plugin/parts/harness/scripts/catalog.py): every loop card matches loops/loop.schema.json and
# loops/FORMAT.md, the super-loops agree with the cards' places, and loops/index.yaml and the list in loops/README.md
# are up to date. The checker runs from the change itself; CODEOWNERS makes the owner review any change to it.
name: catalog-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python plugin/parts/harness/scripts/catalog.py check
      - run: python plugin/parts/wizard/scripts/wizard.py check
