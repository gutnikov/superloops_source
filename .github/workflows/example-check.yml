# Every changed loop's example runs through loops.py validate (catalog.py example): each must-fire case fires, each
# must-pass case passes, twice, within its budget. An example is code from the pull request, so this job has a
# read-only token, no secrets and a time limit, and runs on pull_request only, never pull_request_target.
name: example-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  example-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Examples of the changed loops
        if: github.event_name == 'pull_request'
        run: python plugin/parts/harness/scripts/catalog.py example --changed origin/${{ github.base_ref }} _template
      - name: Every example
        if: github.event_name == 'push'
        run: python plugin/parts/harness/scripts/catalog.py example --all
