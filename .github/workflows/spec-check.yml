# The spec-check loop (superloops/loops/spec-check/LOOP.md): the spec under superloops/specs/ is whole.
# The checkers come from the base commit, so a change cannot weaken the check that judges it.
name: spec-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: The base commit's checkers
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="$GITHUB_SHA"; fi
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          echo "base: $BASE"
      - name: Run the loop
        run: |
          RUN="$RUNNER_TEMP/base/superloops/loops/spec-check/run"
          [ -x "$RUN" ] || RUN=superloops/loops/spec-check/run
          SUPERLOOPS_PARTS="$RUNNER_TEMP/base/plugin/parts" "$RUN" .
