# Generated by scripts/catalog.py from loops/<id>/card.md.
# Do not edit by hand: change the card, then run `python3 scripts/catalog.py index`.

ilities:
  correctness: "The product does what it was specified to do: functional suitability, completeness, faultlessness."
  alignment: "The work is what the person meant: the intent, the plan and the result match what was wanted."
  testability: "Behaviour can be checked by tests, and the tests catch what they should."
  maintainability: "The code is easy to read, change and extend: modularity, analysability, modifiability, evolvability, understandability."
  security: "Confidentiality, integrity, privacy, compliance, audit and licences."
  compatibility: "It works with other systems, versions, platforms and locales: integrability, interoperability, portability, i18n."
  performance: "Time behaviour, resource use, capacity, scalability."
  reliability: "Availability, fault tolerance, recoverability, resilience."
  observability: "What the system does can be seen and explained: logs, metrics, traces, debuggability, operability."
  deployability: "A change reaches where it runs, reproducibly and safely: builds, environments, rollouts, installability."
  usability: "People can use it: accessibility, UX, interaction."

