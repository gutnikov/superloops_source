    summary: "Every escape, a failure that got further than it should have, becomes a must-fire case at the phase that should have caught it, and the loop at that phase is fixed or added."
    sensor: inferential
    ilities: [testability, alignment]
    places: [harness:remediation/oracle, harness:remediation/work]
    stages: [continuous]
    speed: [hours, days]
    needs: []
    agent: [investigator]
    related: [correction-becomes-rule, sample-audit, release-confirmation, agent-calibration]
  - id: stop-hook
    title: "Stop hook / `/goal`"
    path: stop-hook/card.md
    summary: "When the agent tries to end its turn, a hook runs the check and sends the agent back to work while it fails; `/goal` does the same with a model that judges the transcript."
    sensor: computational
    ilities: [correctness]
    places: [delivery/work, remediation/work, maintenance/work]
    stages: [local]
    speed: [seconds, minutes]
    needs: []
    agent: [judge]
    related: [acceptance-loop, verification-subagent, pre-commit-pre-push, autoformat-hook, stall-detector]
  - id: structured-logs
    title: "Structured logs and log queries"
    path: structured-logs/card.md
    summary: "The agent starts the application, queries the logs, finds the error and fixes it (at OpenAI: LogQL against an ephemeral VictoriaLogs per worktree)."
    sensor: computational
    ilities: [observability]
    places: [delivery/work, delivery/confirmation, remediation/oracle, remediation/confirmation, maintenance/confirmation]
    stages: [local, production]
    speed: [seconds]
    needs: [logs]
    agent: [investigator]
    related: [taste-invariants, isolated-environment, traces-opentelemetry, browser-console-devtools]
  - id: task-restatement
    title: "Task restatement"
    path: task-restatement/card.md
    summary: "The agent restates the task in its own words: what it understood, what is out of scope, and what will show it is done. A person answers \"yes\" or corrects the restatement."
    sensor: human
    ilities: [alignment]
    places: [delivery/oracle, discovery/oracle]
    stages: [task]
    speed: [seconds]
    needs: []
    related: [interview, plan-approval, human-acceptance-criteria]
    when: [before]
    initiator: agent
    sync: blocking
    assesses: [intent]
  - id: taste-invariants
    title: "Taste invariants: custom lints"
    path: taste-invariants/card.md
    summary: "The agent breaks a team convention, such as an unstructured log line, a misnamed schema or a file over the size limit; a custom lint flags the violation in seconds and tells the agent how to fix it."
    sensor: computational
    ilities: [maintainability, observability]
    places: [delivery/work, remediation/work, maintenance/work]
    stages: [local, ci]
    speed: [seconds]
    needs: []
    related: [lint-with-fix-instructions, correction-becomes-rule, steering-loop, garbage-collection]
  - id: terminal-ui-tmux
    title: "Terminal UI through tmux"
    path: terminal-ui-tmux/card.md
    summary: "The agent runs a terminal app in a tmux session of fixed size, sends keys and reads the screen with capture-pane; a smoke test passes only after a real interaction, not at startup."
    sensor: computational
    ilities: [correctness, usability]
    places: [delivery/work, remediation/work, maintenance/work, delivery/release]
    stages: [local, ci]
    speed: [seconds, minutes]
    needs: []
    related: [e2e-browser, agentic-manual-testing, health-checks-smoke, accessibility-tree-navigation]
  - id: test-admission
    title: "A test must pay for its upkeep"
    path: test-admission/card.md
    summary: "Before adding a test, the agent names the contract it protects, the regression that breaks it and why no existing test catches it, and shows it failing; a test without the three answers is not added."
    sensor: computational
    ilities: [testability, maintainability]
    places: [delivery/work, remediation/work, maintenance/work]
    stages: [local, ci]
    speed: [seconds, minutes]
    needs: []
    agent: [reviewer]
    related: [mutation-testing, red-green-tdd, reproduction-gate, code-coverage, agent-code-review, check-incubation]
  - id: tool-use-telemetry
    title: "Tool-use telemetry from agent sessions"
    path: tool-use-telemetry/card.md
    summary: "A script reads the agent's session transcripts and reports, per tool, model and file type, how often calls fail and why; the worst cases show what to fix in the tool or the guide."
    sensor: computational
    ilities: [observability]
    places: [harness:remediation/entry, harness:maintenance/entry]
    stages: [scheduled]
    speed: [seconds, minutes]
    needs: []
    related: [correction-becomes-rule, steering-loop, lint-with-fix-instructions]
  - id: traces-opentelemetry
    title: "Traces (OpenTelemetry)"
    path: traces-opentelemetry/card.md
    summary: "The agent queries traces (TraceQL) and finds a slow or failed span."
    sensor: computational
    ilities: [observability, performance]
    places: [delivery/work, remediation/oracle]
    stages: [local]
    speed: [seconds]
    needs: [traces]
    agent: [investigator]
    related: [perf-budgets-telemetry, load-testing, structured-logs, metrics-promql]
  - id: translation-sync
    title: "Translations stamped with their source text"
    path: translation-sync/card.md
    summary: "Each translation records a hash of the text it was translated from; a changed original makes it stale, and a check fails on broken params, link ids and code spans."
    sensor: computational
    ilities: [compatibility, usability]
    places: [delivery/work, delivery/release, maintenance/work]
    stages: [local, ci]
    speed: [seconds]
    needs: []
    agent: [worker]
    related: [i18n-pseudolocalization, executable-docs, approved-fixtures]
  - id: triage
    title: "Triage: every signal goes to one super-loop, with its oracle"
    path: triage/card.md
    summary: "Triage merges each incoming error, alert, bot's PR, user's message or ticket with any open item on the same thing, and routes it to one super-loop; the route decides the oracle."
    sensor: inferential
    ilities: [alignment]
    places: [delivery/entry, remediation/entry, maintenance/entry, discovery/entry]
    stages: [continuous]
    speed: [minutes]
    needs: []
    agent: [judge]
    related: [behaviour-invariance, reproduction-gate, acceptance-loop, discovery-decision]
  - id: type-check
    title: "Type checking"
    path: type-check/card.md
    summary: "The agent runs `tsc --noEmit`, `mypy` or `pyright` and fixes the type mismatches it finds."
    sensor: computational
    ilities: [correctness]
    places: [delivery/work, remediation/work, maintenance/work]
    stages: [edit, local, ci]
    speed: [seconds]
    needs: []
    related: [build, lsp-diagnostics, lint-with-fix-instructions]
  - id: user-feedback
    title: "User feedback"
    path: user-feedback/card.md
    summary: "One piece of user feedback becomes acceptance criteria tied to a reproducible scenario, approved by a person; the agent works to them, and they become its spec and test."
    sensor: human
    ilities: [alignment, usability]
    places: [delivery/oracle, remediation/oracle]
    stages: [task]
    speed: [hours, days]
    needs: []
    related: [production-users, acceptance-loop, reproduction-gate, human-acceptance-criteria]
    when: [before]
    initiator: agent
    sync: blocking
    assesses: [intent]
  - id: ux-evaluator
    title: "UX evaluator with thresholds"
    path: ux-evaluator/card.md
    summary: "A separate agent walks the app with Playwright MCP like a user, grades depth, functionality, design and code, and once calibrated fails a sprint below any threshold; the generator gets a breakdown."
    sensor: inferential
    ilities: [usability, correctness]
    places: [delivery/gate]
    stages: [sprint]
    speed: [minutes]
    needs: [browser]
    agent: [explorer, judge]
    related: [llm-judge-calibration, verification-subagent, e2e-browser, visual-screenshot-check]
  - id: verification-subagent
    title: "Verification subagent"
    path: verification-subagent/card.md
    summary: "When the working agent says a task is done, a separate subagent with a fresh context tries to prove the claim wrong."
    sensor: inferential
    ilities: [correctness]
    places: [delivery/gate, remediation/gate, maintenance/gate, discovery/gate]
    stages: [task]
    speed: [minutes]
    needs: []
    agent: [refuter]
    related: [acceptance-loop, reproduction-gate, agent-code-review, stop-hook]
  - id: visual-screenshot-check
    title: "Visual check with screenshots"
    path: visual-screenshot-check/card.md
    summary: "The agent takes a screenshot, compares it with the mockup, lists the differences and fixes them."
    sensor: inferential
    ilities: [usability]
    places: [delivery/work, remediation/work, maintenance/work]
    stages: [local, ci]
    speed: [seconds, minutes]
    needs: [browser]
    agent: [judge]
    related: [approved-fixtures, ux-evaluator, e2e-browser, llm-judge-calibration]
  - id: visual-stability-oracle
    title: "Layout continuity under CPU stress"
    path: visual-stability-oracle/card.md
    summary: "A probe samples the layout of named regions on every frame while the CPU is slowed; declared invariants catch jumps, flashes, blank frames and overlaps that a final screenshot never shows."
    sensor: computational
    ilities: [usability, performance]
    places: [delivery/work, remediation/oracle, maintenance/gate]
    stages: [local]
    speed: [minutes]
    needs: [browser]
    related: [e2e-browser, visual-screenshot-check, check-incubation, lighthouse-ci]

